# Netlify build configuration for the FlexiLoans HRMS clone.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Public demo build: shows the demo banner and neutral branding.
  # Remove this, or set it to "false", for a FlexiLoans-branded deploy.
  VITE_PUBLIC_DEMO = "true"

[context.deploy-preview.environment]
  VITE_PUBLIC_DEMO = "true"

# The app uses hash routing (#/leave), so no SPA rewrite is strictly needed.
# This catch-all keeps any stray deep link working anyway.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
