# Netlify build configuration for the FlexiLoans HRMS clone.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # VITE_PUBLIC_DEMO is deliberately not set here: values in this file
  # override the Netlify UI, which would force every site into one mode.
  # Set it per site under Site configuration -> Environment variables:
  #   demo site: VITE_PUBLIC_DEMO = true   (neutral branding + demo banner)
  #   live site: leave unset               (FlexiLoans branding)

# Pull-request previews are always the neutral demo build, on either site.
[context.deploy-preview.environment]
  VITE_PUBLIC_DEMO = "true"

# The app uses hash routing (#/leave), so no SPA rewrite is strictly needed.
# This catch-all keeps any stray deep link working anyway.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
