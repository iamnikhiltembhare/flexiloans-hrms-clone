name: Android APK

# Builds the installable APK on every push to main and publishes it to the
# "android-latest" GitHub release, so the newest build is always one tap away
# on a phone. Built here rather than locally because the Android toolchain
# needs Java network access that some managed laptops block.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npx oxlint src server
      - run: npm run test:server

      # Two apps from one project. Each web bundle is built, copied into the
      # Android project, and packaged by its own flavor:
      #   prod - production API          -> FlexiLoans-HRMS.apk
      #   qa   - isolated test env + TEST -> FlexiLoans-HRMS-Test.apk
      - name: Build production APK
        run: |
          npx vite build --mode android
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew --no-daemon assembleProdDebug
          cp app/build/outputs/apk/prod/debug/app-prod-debug.apk "$GITHUB_WORKSPACE/FlexiLoans-HRMS.apk"

      - name: Build test APK
        run: |
          npx vite build --mode androidtest
          npx cap sync android
          cd android && ./gradlew --no-daemon assembleQaDebug
          cp app/build/outputs/apk/qa/debug/app-qa-debug.apk "$GITHUB_WORKSPACE/FlexiLoans-HRMS-Test.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: FlexiLoans-HRMS-apks
          path: |
            FlexiLoans-HRMS.apk
            FlexiLoans-HRMS-Test.apk

      - name: Publish to the android-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Built from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC').

          - FlexiLoans-HRMS.apk - the app, production data.
          - FlexiLoans-HRMS-Test.apk - separate test app (installs alongside, amber TEST badge) with its own test data and test logins: test.employee / TestEmp@2026, test.hr / TestHR@2026, test.admin / TestAdmin@2026.

          Install: open this page on the phone, download the APK, allow installs from your browser when asked."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest FlexiLoans-HRMS.apk FlexiLoans-HRMS-Test.apk --clobber
            gh release edit android-latest --notes "$notes" --target "$GITHUB_SHA"
          else
            gh release create android-latest FlexiLoans-HRMS.apk FlexiLoans-HRMS-Test.apk --prerelease \
              --title "FlexiLoans HRMS - latest Android build" --notes "$notes" --target "$GITHUB_SHA"
          fi
