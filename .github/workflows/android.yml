name: Android APK

# Builds the installable APK on every push to main and publishes it to the
# "android-latest" GitHub release, so the newest build is always one tap away
# on a phone. Built here rather than locally because the Android toolchain
# needs Java network access that some managed laptops block.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npx oxlint src server
      - run: npm run test:server

      # Web bundle pointed at the hosted API (.env.android), copied into the
      # Android project.
      - run: npx vite build --mode android
      - run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/FlexiLoans-HRMS.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: FlexiLoans-HRMS-apk
          path: FlexiLoans-HRMS.apk

      - name: Publish to the android-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Built from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC'). Install on Android: open this page on the phone, download FlexiLoans-HRMS.apk, allow installs from your browser when asked."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest FlexiLoans-HRMS.apk --clobber
            gh release edit android-latest --notes "$notes" --target "$GITHUB_SHA"
          else
            gh release create android-latest FlexiLoans-HRMS.apk --prerelease \
              --title "FlexiLoans HRMS - latest Android build" --notes "$notes" --target "$GITHUB_SHA"
          fi
